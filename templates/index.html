<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR URL Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; color: #222; }
    form { display: flex; gap: 8px; margin: 24px 0; }
    input[type=url] { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; }
    button { padding: 10px 18px; font-size: 16px; border: 0; border-radius: 6px; background: #2b6cb0; color: #fff; cursor: pointer; }
    #msg { color: #c53030; min-height: 1.2em; }
    .card { display: flex; gap: 16px; align-items: center; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .card img { width: 96px; height: 96px; }
    .card a, .orig { word-break: break-all; }
    .orig { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <h1>QR URL Shortener</h1>
  <form id="f">
    <input type="url" id="url" placeholder="https://example.com/some/very/long/link" required>
    <button type="submit">Shorten</button>
  </form>
  <div id="msg"></div>
  <h2>Recent links</h2>
  {% for l in links %}
  <div class="card">
    <img src="{{ l.qr }}" alt="QR code">
    <div>
      <a href="{{ l.short }}" target="_blank">{{ l.short }}</a>
      <div class="orig">{{ l.url }}</div>
      <div class="orig">{{ l.clicks }} click(s)</div>
    </div>
  </div>
  {% else %}
  <p>No links yet.</p>
  {% endfor %}
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/shorten', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: document.getElementById('url').value})
      });
      const data = await res.json();
      if (!res.ok) { document.getElementById('msg').textContent = data.error; return; }
      location.reload();
    });
  </script>
</body>
</html>
